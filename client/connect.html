<!doctype html>
<html>
  <head>
    <title>Mooz</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="connect-shell">
      <header class="top-bar connect-top-bar">
        <h1><span class="logo-m">M</span>ooz</h1>
      </header>

      <main class="connect-card">
        <div class="connect-copy">
          <h2>Start a room or join by ID</h2>
          <p>
            Create a new meeting as the admin, or join an existing room using a
            shared link or room ID.
          </p>
        </div>

        <form class="connect-form" onsubmit="return false;">
          <label>
            Name
            <input
              required
              id="nameInput"
              type="text"
              placeholder="Enter your name"
            />
          </label>

          <label>
            Room ID
            <input
              id="roomInput"
              type="text"
              placeholder="Paste an invite link or room id"
            />
          </label>

          <label class="debug-checkbox">
            <input id="debugInput" type="checkbox" />
            Enable debug metrics in the meeting
          </label>

          <div class="connect-actions">
            <button type="button" class="btn primary" id="createBtn">
              Create meeting
            </button>
            <button type="button" class="btn" id="joinBtn">Join meeting</button>
          </div>

          <div class="connect-hint" id="roomHint"></div>
        </form>
      </main>
    </div>

    <script>
      const userId = crypto.randomUUID();
      const nameInput = document.getElementById('nameInput');
      const roomInput = document.getElementById('roomInput');
      const debugInput = document.getElementById('debugInput');
      const roomHint = document.getElementById('roomHint');

      function normalizeRoomId(value) {
        return value
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9-]/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function resolveRoomValue(value) {
        try {
          const url = new URL(value, window.location.href);
          const roomFromQuery = url.searchParams.get('room');
          if (roomFromQuery) return roomFromQuery;
        } catch (error) {
          // Treat non-URL text as a room id.
        }

        return value;
      }

      function goToMeeting(role) {
        const name = nameInput.value.trim();
        const debugEnabled = debugInput.checked;
        let roomId = resolveRoomValue(roomInput.value);

        if (role === 'admin') {
          roomId = normalizeRoomId(roomId || crypto.randomUUID().slice(0, 8));
        } else {
          roomId = normalizeRoomId(roomId);
        }

        if (!name) return;
        if (!roomId) {
          roomHint.textContent = 'Enter a room ID or create a new meeting.';
          return;
        }

        localStorage.setItem('user', userId);
        localStorage.setItem('role', role);
        localStorage.setItem('name', name);
        localStorage.setItem('roomId', roomId);
        sessionStorage.setItem('meetingDebugEnabled', String(debugEnabled));
        sessionStorage.removeItem('meetingMetricsOpen');

        window.location.href = `./index.html?room=${encodeURIComponent(roomId)}`;
      }

      const params = new URLSearchParams(window.location.search);
      const roomFromUrl = params.get('room');
      if (roomFromUrl) {
        roomInput.value = roomFromUrl;
        roomHint.textContent = `Joining room ${roomFromUrl}`;
      }

      debugInput.checked =
        sessionStorage.getItem('meetingDebugEnabled') === 'true';
      nameInput.value = localStorage.getItem('name') || '';
      roomInput.value = roomInput.value || localStorage.getItem('roomId') || '';

      document.getElementById('createBtn').addEventListener('click', () => {
        goToMeeting('admin');
      });

      document.getElementById('joinBtn').addEventListener('click', () => {
        goToMeeting('client');
      });

      roomInput.addEventListener('input', () => {
        roomHint.textContent = roomInput.value.trim()
          ? `Room: ${roomInput.value.trim()}`
          : '';
      });
    </script>
  </body>
</html>
